<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAA HiFi — Integrating Sound & Vision for Artists</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 40px;
      opacity: 0.85;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      color: #222222;
    }
    p.tagline {
      font-size: 1.05rem;
      font-style: italic;
      color: #666666;
      margin-bottom: 40px;
    }
    .contact {
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #888888;
    }
    .contact a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #cccccc;
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .contact a:hover {
      border-color: #333333;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SVG van je waveform logo -->
    <svg class="logo" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 40H190" stroke="#4A4A4A" stroke-width="4" stroke-linecap="round"/>
      <path d="M25 55C25 55 35 20 50 20C65 20 70 55 85 55C100 55 105 20 120 20C135 20 140 55 155 55C170 55 175 25 175 25" stroke="#4A4A4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>AAA HiFi</h1>
    <p class="tagline">Integrating Sound &amp; Vision for Artists.</p>

    <div class="contact">
      <a href="mailto:info@aaahifi.com">info@aaahifi.com</a>
    </div>
  </div>
</body>
</html>
